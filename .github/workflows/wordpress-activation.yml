name: WordPress activation smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} activation
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.0'
          - php: '8.3'
            wordpress: 'latest'
          - php: '8.4'
            wordpress: 'latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, curl, dom, json, libxml, mbstring, zip
          coverage: none
          tools: none

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client gettext rsync
          curl -L -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Verify translation readiness and POT extraction
        run: ./scripts/check-i18n.sh /tmp/indexlane-redirect-internal-link-auditor.pot

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uwordpress -pwordpress --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "Database did not become ready" >&2
          exit 1

      - name: Install WordPress
        run: |
          mkdir -p /tmp/wp
          wp_version='${{ matrix.wordpress }}'
          wp_download_args=(--path=/tmp/wp --skip-content --force)
          if [ "$wp_version" != "latest" ]; then
            wp_download_args=(--version="$wp_version" "${wp_download_args[@]}")
          fi
          wp core download "${wp_download_args[@]}"
          wp config create \
            --path=/tmp/wp \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp db reset --yes --path=/tmp/wp
          wp core install \
            --path=/tmp/wp \
            --url=http://example.test \
            --title="Plugin CI" \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.test \
            --skip-email

      - name: Copy plugin into WordPress
        run: |
          mkdir -p /tmp/wp/wp-content/plugins/indexlane-redirect-internal-link-auditor
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='vendor' \
            ./ /tmp/wp/wp-content/plugins/indexlane-redirect-internal-link-auditor/

      - name: Activate plugin
        run: |
          wp plugin activate indexlane-redirect-internal-link-auditor --path=/tmp/wp
          wp plugin status indexlane-redirect-internal-link-auditor --path=/tmp/wp
          wp eval 'if ( ! class_exists( "IndexLane_Redirect_Internal_Link_Auditor" ) ) { fwrite( STDERR, "Plugin class not loaded.\n" ); exit( 1 ); }' --path=/tmp/wp

      - name: Run WordPress integration tests
        run: wp eval-file /tmp/wp/wp-content/plugins/indexlane-redirect-internal-link-auditor/tests/wordpress-integration.php --path=/tmp/wp

      - name: Prepare authenticated AJAX test site
        run: |
          mkdir -p /tmp/wp/wp-content/mu-plugins
          cp /tmp/wp/wp-content/plugins/indexlane-redirect-internal-link-auditor/tests/fixtures/ajax-http-fixture.php /tmp/wp/wp-content/mu-plugins/
          wp config set INDEXLANE_RILA_E2E true --raw --path=/tmp/wp
          wp config set DISABLE_WP_CRON true --raw --path=/tmp/wp
          wp option update home http://127.0.0.1:8080 --path=/tmp/wp
          wp option update siteurl http://127.0.0.1:8080 --path=/tmp/wp
          wp eval-file /tmp/wp/wp-content/plugins/indexlane-redirect-internal-link-auditor/tests/wordpress-ajax-setup.php --path=/tmp/wp

      - name: Start WordPress web server
        run: |
          php -S 127.0.0.1:8080 -t /tmp/wp >/tmp/indexlane-rila-wp-server.log 2>&1 &
          echo $! >/tmp/indexlane-rila-wp-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/wp-login.php >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/indexlane-rila-wp-server.log
          exit 1

      - name: Run authenticated AJAX end-to-end tests
        run: bash tests/wordpress-ajax-e2e.sh http://127.0.0.1:8080 admin password

      - name: Show WordPress server log on failure
        if: failure()
        run: cat /tmp/indexlane-rila-wp-server.log || true

      - name: Stop WordPress web server
        if: always()
        run: |
          if [ -f /tmp/indexlane-rila-wp-server.pid ]; then
            kill "$(cat /tmp/indexlane-rila-wp-server.pid)" || true
          fi
          rm -f /tmp/indexlane-rila-wp-server.pid /tmp/indexlane-rila-wp-server.log
